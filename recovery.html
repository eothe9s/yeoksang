<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曆象 · 기록 보호</title>
<style>body{font:16px system-ui;background:#f2f5f9;color:#243447;max-width:640px;margin:50px auto;padding:24px}button,a{display:inline-block;padding:14px;margin:8px 8px 8px 0}button{background:#607da8;color:white;border:0;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.7}</style>
<h1>曆象 · 기록 보호</h1><p>이 페이지는 저장값을 읽고 파일로 내보내기만 합니다. 기록 삭제·초기화·덮어쓰기를 하지 않습니다. 기존 앱과 같은 Safari에서 열어 주세요.</p>
<button id="raw">기존 DB 원본 내려받기</button><button id="all">관련 저장값 전체 내려받기</button><pre id="status"></pre><a href="./index.html?v=260">앱으로 돌아가기</a>
<script>
const status=document.getElementById('status');
function download(value,name){const u=URL.createObjectURL(new Blob([value],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);}
const ready=new Promise(resolve=>{
 if(!globalThis.indexedDB){resolve(null);return;}
 const r=indexedDB.open('yeoksang-records-v1');r.onupgradeneeded=()=>r.transaction.abort();r.onerror=()=>resolve(null);
 r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains('records')){db.close();resolve(null);return;}const t=db.transaction(['records','history'],'readonly'),record=t.objectStore('records').get('current'),hist=t.objectStore('history').get('recent');t.oncomplete=()=>{db.close();resolve({raw:record.result?.raw,history:hist.result||[]});};t.onabort=t.onerror=()=>{db.close();resolve(null);};};
});
document.getElementById('raw').onclick=async()=>{try{const data=await ready,raw=data?.raw||localStorage.getItem('p11122_v60_db');if(raw===null){status.textContent='주기록을 찾지 못했습니다. 기존 앱과 같은 브라우저·주소인지 확인하세요.';return;}download(raw,'YEOKSANG_EXISTING_RAW.json');}catch(e){status.textContent='읽기 실패: '+e.name;}};
document.getElementById('all').onclick=async()=>{try{const values={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(p11122|yeoksang)/i.test(k))values[k]=localStorage.getItem(k);}const data=await ready;download(JSON.stringify({format:'YEOKSANG_RECORD_STORAGE_ARCHIVE',version:2,exportedAt:new Date().toISOString(),values,indexedDB:data},null,2),'YEOKSANG_STORAGE_ARCHIVE.json');}catch(e){status.textContent='읽기 실패: '+e.name;}};
ready.then(data=>{const raw=data?.raw||localStorage.getItem('p11122_v60_db');status.textContent=raw?'주기록 발견 · '+(data?.raw?'IndexedDB':'기존 저장소')+' · '+raw.length+'자':'주기록 없음';});
</script></html>
